apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No 'namespace:' override: it rewrites metadata.namespace inside the
# SOPS-encrypted Secret and breaks its MAC (Flux: "Could not decrypt value").
# Every resource sets its own namespace.
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - backup-cronjob.yaml
  # Encrypted Secret. Must exist and be encrypted with the age key whose
  # public counterpart is in ../../../.sops.yaml. Source: the example at
  # ../../clusters/homelab/secrets/vaultwarden-secrets.sops.yaml.example.
  - ../../clusters/homelab/secrets/vaultwarden-secrets.sops.yaml
patches:
  - path: patches/deployment-node-selector.yaml

