apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No 'namespace:' override: it would rewrite metadata.namespace inside the
# SOPS-encrypted Secret and break its MAC (the Vaultwarden decryption failure).
# Every resource sets its own namespace.
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  # Root credentials, encrypted with the age key in ../../.sops.yaml.
  - ../../clusters/homelab/secrets/object-storage-secrets.sops.yaml
patches:
  - path: patches/deployment-node-selector.yaml
