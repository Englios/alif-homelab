---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: object-storage
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/instance: rustfs
    # Run the Tailscale proxy on debian (see infrastructure/tailscale-operator).
    tailscale.com/proxy-class: system
  annotations:
    # The Tailscale operator creates a tailnet device named 's3':
    #   S3 API   http://s3.<tailnet>.ts.net:9000
    #   Console  http://s3.<tailnet>.ts.net:9001
    # Traffic is encrypted by WireGuard; there is no LAN or public exposure.
    tailscale.com/expose: "true"
    tailscale.com/hostname: "s3"
spec:
  type: ClusterIP
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
      protocol: TCP
    - name: console
      port: 9001
      targetPort: 9001
      protocol: TCP
  selector:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/instance: rustfs
