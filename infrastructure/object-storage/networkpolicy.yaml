---
# Ingress: the Tailscale operator's proxy pods (tailscale namespace), plus
# in-cluster pods labelled app.kubernetes.io/part-of: object-storage-access
# for future workloads that use S3 from inside the cluster.
# Egress: DNS only. RustFS needs nothing else outbound.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rustfs
  namespace: object-storage
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rustfs
      app.kubernetes.io/instance: rustfs
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/part-of: object-storage-access
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9001
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
