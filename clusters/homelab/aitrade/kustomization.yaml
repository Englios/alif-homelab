apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gitrepository.yaml
  - aitrade-prod-kustomization.yaml
  - image-repository.yaml
  - image-policy.yaml
  - image-automation.yaml
  - aitrade-auth.sops.yaml

# The encrypted Secret (aitrade-auth.sops.yaml, line 9 above) is the live
# file committed to this directory.  The plain-text template lives under
# ../secrets/aitrade-auth.sops.yaml.example — copy content from there when
# editing the live file, but NEVER commit unencrypted secrets.
#
# The Secret contains an SSH deploy key (write-enabled) for the ai-trade
# repo.  Key fields (all base64-encoded in `data`):
#   - identity       — SSH private key (PEM)
#   - identity.pub   — SSH public key
#   - known_hosts    — github.com host fingerprint from ssh-keyscan
#
# Optional fields (omitted = Flux uses defaults):
#   - username       — default "git" when absent; only set for non-GitHub hosts
#   - password       — only needed for passphrase-protected private keys
#
# The GitRepository URL is ssh://git@github.com/Englios/ai-trade.git.
# No provider field is set — Flux uses the SSH key in the Secret to
# authenticate when cloning.  The same key pushes tag-bump commits for
# ImageUpdateAutomation, so write access is required.
#
# See clusters/homelab/secrets/aitrade-auth.sops.yaml.example for the full
# template with placeholder values, creation steps, and rotation procedure.
